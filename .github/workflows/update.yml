name: Aggiorna pronostici

on:
  schedule:
    # UTC. Con l'Italia a UTC+2 (ora legale) sono le 14:00 locali.
    # ATTENZIONE: domenica 25 ottobre 2026 finisce l'ora legale, l'Italia passa
    # a UTC+1 e questo cron scatterebbe alle 13:00. Va portato a '0 13 * * *'.
    - cron: '0 12 * * *'
  workflow_dispatch:             # pulsante per lanciarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guardia prima di toccare qualunque probabilita': se un test rompe, la
      # pipeline si ferma qui e picks.json/storico.json restano quelli di ieri
      # invece di pubblicare un calcolo non verificato.
      - name: Test del motore
        run: node scripts/test.mjs

      # prima di build.mjs: e' l'ultimo momento in cui data/picks.json contiene
      # ancora i pronostici del giro precedente, quelli da chiudere.
      # Non usa l'API delle quote, solo i risultati pubblici di Understat.
      - name: Chiudi i pronostici gia' giocati
        run: node scripts/chiudi.mjs

      - name: Scarica quote e ricalcola i pronostici
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/build.mjs

      - name: Pubblica i nuovi file
        run: |
          git config user.name  "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/picks.json data/storico.json data/quote-storico.json data/snapshots.json
          git diff --staged --quiet || git commit -m "Quote aggiornate $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
