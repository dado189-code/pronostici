name: Aggiorna pronostici

on:
  schedule:
    # UTC. Con l'Italia a UTC+2 (ora legale) sono le 07:00 e le 17:00 locali.
    # Da fine ottobre, con UTC+1, diventano 06:00 e 16:00: vanno portate a '0 6,16 * * *'.
    - cron: '0 5,15 * * *'
  workflow_dispatch:             # pulsante per lanciarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # prima di build.mjs: e' l'ultimo momento in cui data/picks.json contiene
      # ancora i pronostici del giro precedente, quelli da chiudere.
      # Non usa l'API delle quote, solo i risultati pubblici di Understat.
      - name: Chiudi i pronostici gia' giocati
        run: node scripts/chiudi.mjs

      - name: Scarica quote e ricalcola i pronostici
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/build.mjs

      - name: Pubblica i nuovi file
        run: |
          git config user.name  "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/picks.json data/storico.json
          git diff --staged --quiet || git commit -m "Quote aggiornate $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
