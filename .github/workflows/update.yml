name: Aggiorna pronostici

on:
  schedule:
    - cron: '0 6,12,18 * * *'   # 08:00, 14:00 e 20:00 ora italiana
  workflow_dispatch:             # pulsante per lanciarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scarica quote e ricalcola i pronostici
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/build.mjs

      - name: Pubblica il nuovo file
        run: |
          git config user.name  "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Quote aggiornate $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
